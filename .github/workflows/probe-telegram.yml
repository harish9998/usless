name: telegram feasibility probe (no secrets)

# Bounded, zero-secret experiment for the storage-backend gate. Answers ONLY:
# installable? launchable headless? what answers 127.0.0.1:8550?
# It never signs in, never touches secrets, never claims persistence.
# Manual dispatch only. Not part of the RDP desktop path.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seed envsys (probe script only)
        run: |
          New-Item -ItemType Directory -Path 'C:\Work' -Force | Out-Null
          Copy-Item -LiteralPath "${{ github.workspace }}\envsys\Probe-TelegramInstall.ps1" -Destination 'C:\Work\Probe-TelegramInstall.ps1' -Force
          Write-Host "Probe script staged."

      - name: Run Telegram install/launch/health probe
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File 'C:\Work\Probe-TelegramInstall.ps1'
          if ($LASTEXITCODE -ne 0) { Write-Error "Probe errored (no verdict) - see PROBE| lines."; exit 1 }
          Write-Host "Probe delivered a verdict - see PROBE|VERDICT."
