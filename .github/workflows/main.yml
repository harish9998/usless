name: win 11 + tailscale + Download.bat script

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'rdp = desktop; test = LocalDir harness; probe = install probe; telegram-e2e = backend transaction; snapshot-e2e = Runner A publish; restore-e2e = Runner B restore'
        required: false
        default: 'rdp'
        type: choice
        options: [rdp, test, probe, telegram-e2e, snapshot-e2e, restore-e2e]

# GITHUB_TOKEN may dispatch successor runs (6h-cap rebirth chain)
permissions:
  contents: read
  actions: write

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Checkout (envsys runtime)
        uses: actions/checkout@v4

      - name: Configure Core RDP Settings
        if: ${{ inputs.mode == 'rdp' }}
        run: |
          # Enable Remote Desktop and disable Network Level Authentication (if needed)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 1 -Force

          # Remove any existing rule with the same name to avoid duplication
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          # Allow RDP on port 3389 (all profiles: Tailscale NIC classifies as Public)
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          # Ensure the service survives: Automatic + running (restart picks up registry flip)
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService -ErrorAction SilentlyContinue
          Restart-Service -Name TermService -Force

      - name: Seed envsys runtime (first boot only, never overwrite restored state)
        run: |
          New-Item -ItemType Directory -Path 'C:\Work' -Force | Out-Null
          if (-not (Test-Path 'C:\Work\envsys\Storage-Backend.ps1')) {
              Copy-Item -LiteralPath "${{ github.workspace }}\envsys" -Destination 'C:\Work\envsys' -Recurse -Force
              Write-Host "Seeded C:\Work\envsys from repo."
          } else { Write-Host "C:\Work\envsys present (restored) - leaving untouched." }

      - name: Create RDP User with Fixed Password
        if: ${{ inputs.mode == 'rdp' }}
        run: |
          $password = "${{ secrets.RDP_PASSWORD }}"
          if ([string]::IsNullOrWhiteSpace($password)) { $password = "Runner@12345" }
          Write-Host "Using RDP_PASSWORD secret (length only): $($password.Length)"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          } else {
              Set-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires | Out-Null
              Enable-LocalUser -Name "RDP"
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install SSH server (headless terminal-only access)
        if: ${{ inputs.mode == 'rdp' }}
        run: |
          $svc = Get-Service sshd -ErrorAction SilentlyContinue
          if (-not $svc) { Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null }
          Set-Service sshd -StartupType Automatic
          Start-Service sshd -ErrorAction SilentlyContinue
          netsh advfirewall firewall delete rule name="SSH-Tailscale" 2>$null | Out-Null
          netsh advfirewall firewall add rule name="SSH-Tailscale" dir=in action=allow protocol=TCP localport=22 | Out-Null
          New-Item -ItemType Directory 'HKLM:\SOFTWARE\OpenSSH' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\OpenSSH' -Name DefaultShell `
            -Value 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe' -PropertyType String -Force | Out-Null
          $key = "${{ secrets.SSH_PUBLIC_KEY }}"
          if (-not [string]::IsNullOrWhiteSpace($key)) {
              # admins_authorized_keys = works for any Administrators member (RDP user is one)
              $file = 'C:\ProgramData\ssh\administrators_authorized_keys'
              [IO.File]::WriteAllText($file, ($key.Trim() + "`n"))   # LF only, no CRLF
              icacls $file /inheritance:r /grant 'SYSTEM:F' /grant 'BUILTIN\Administrators:F' | Out-Null
              Write-Host "SSH|KEYAUTH=ENABLED"
          } else { Write-Host "SSH|KEYAUTH=ABSENT (SSH_PUBLIC_KEY secret not set; password auth only)" }
          Write-Host "SSH|STATUS=$((Get-Service sshd).Status) PORT22=OK"

      - name: Install Tailscale
        if: ${{ inputs.mode == 'rdp' }}
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force
          Start-Service Tailscale -ErrorAction SilentlyContinue

      - name: Establish Tailscale Connection
        if: ${{ inputs.mode == 'rdp' }}
        run: |
          # Bring up Tailscale with the provided auth key and set a unique hostname
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID --accept-dns=false --accept-routes --unattended

          # Wait for Tailscale to assign an IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Persistence status (honest)
        run: |
          # No permanent VPS exists, so the VPS sync path was removed. There is currently
          # NO durable store configured: workspace changes live and die with this runner.
          # This step stays red-free but never claims persistence it cannot prove.
          Write-Host "PERSISTENCE|STORE=NONE-CONFIGURED|STATUS=NOT-READY"
          Write-Host "VPS path removed (no permanent VPS exists)."
          if ([string]::IsNullOrWhiteSpace("${{ secrets.TG_API_KEY }}")) {
              Write-Host "Telegram backend: SKIP (TG_API_KEY not set; provisional until a fresh-runner auth test passes)."
          } else {
              Write-Host "Telegram backend: PROVISIONAL (key present; fresh-runner sign-in proof still required)."
          }

      - name: Run LocalDir regression harness (Test-EnvSystem)
        if: ${{ inputs.mode == 'test' }}
        run: |
          # Zero secrets, no network. Fails the run on any FAIL; skips stay visible.
          $store = Join-Path $env:RUNNER_TEMP 'envstore-test'
          powershell -NoProfile -ExecutionPolicy Bypass -File 'C:\Work\envsys\Test-EnvSystem.ps1' -StoreRoot $store -RepoRoot '${{ github.workspace }}'
          if ($LASTEXITCODE -ne 0) { Write-Error "Harness reported FAIL - see TEST| lines above."; exit 1 }
          Write-Host "HARNESS|STATUS=READY"

      - name: Telegram install/launch/health probe (zero secrets)
        if: ${{ inputs.mode == 'probe' }}
        run: |
          # Bounded feasibility experiment for the storage-backend gate. Never signs
          # in, never touches secrets. Verdict in PROBE|VERDICT. Exit 0 = verdict
          # delivered (even if negative); exit 1 = probe infrastructure error.
          Copy-Item -LiteralPath "${{ github.workspace }}\envsys\Probe-TelegramInstall.ps1" -Destination "$env:RUNNER_TEMP\Probe-TelegramInstall.ps1" -Force
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\Probe-TelegramInstall.ps1"
          if ($LASTEXITCODE -ne 0) { Write-Error "Probe errored (no verdict) - see PROBE| lines."; exit 1 }
          Write-Host "PROBE|STATUS=DELIVERED"
          # Production seeding script against the just-probed app, with a DUMMY
          # key (not a secret) and no session dir: expect REST=UP + SIGNED-OUT.
          $env:TG_API_KEY = 'probe-dummy-key-not-a-secret'
          powershell -NoProfile -ExecutionPolicy Bypass -File 'C:\Work\envsys\Enable-TelegramRest.ps1'
          if ($LASTEXITCODE -ne 0) { Write-Error "Enable-TelegramRest failed with dummy key."; exit 1 }
          Remove-Item Env:\TG_API_KEY -ErrorAction SilentlyContinue
          Write-Host "ENABLE-SCRIPT|STATUS=READY-WITH-DUMMY-KEY"

      - name: Telegram end-to-end persistence transaction (synthetic, needs secrets)
        if: ${{ inputs.mode == 'telegram-e2e' }}
        timeout-minutes: 25
        run: |
          # Decisive backend test. Requires TG_API_KEY + TG_SESSION_B64[_N] secrets
          # (set by YOU in repo Settings; never pasted anywhere). Without them the
          # script fails E00 honestly - a red run here means "not configured", and
          # after configuration it means a REAL failure. Synthetic 1 KB object
          # under envsys-e2e/<run-id>/, removed afterwards; your files untouched.
          $env:TG_API_KEY = "${{ secrets.TG_API_KEY }}"
          if ([string]::IsNullOrWhiteSpace($env:TG_API_KEY)) { $env:TG_API_KEY = "${{ secrets.TG_API }}" }
          $env:TG_SESSION_B64 = "${{ secrets.TG_SESSION_B64 }}"
          # Chunked bundle support (missing secrets evaluate to empty, safely ignored).
          $env:TG_SESSION_B64_1 = "${{ secrets.TG_SESSION_B64_1 }}"
          $env:TG_SESSION_B64_2 = "${{ secrets.TG_SESSION_B64_2 }}"
          $env:TG_SESSION_B64_3 = "${{ secrets.TG_SESSION_B64_3 }}"
          $env:TG_SESSION_B64_4 = "${{ secrets.TG_SESSION_B64_4 }}"
          $env:TG_SESSION_B64_5 = "${{ secrets.TG_SESSION_B64_5 }}"
          $env:TG_SESSION_B64_6 = "${{ secrets.TG_SESSION_B64_6 }}"
          $env:TG_SESSION_B64_7 = "${{ secrets.TG_SESSION_B64_7 }}"
          $env:TG_SESSION_B64_8 = "${{ secrets.TG_SESSION_B64_8 }}"
          $env:TG_SESSION_B64_9 = "${{ secrets.TG_SESSION_B64_9 }}"
          # Fresh runners have no app: install it first via the proven probe
          # (short poll; the e2e below does the real verification).
          Copy-Item -LiteralPath "${{ github.workspace }}\envsys\Probe-TelegramInstall.ps1" -Destination "$env:RUNNER_TEMP\Probe-TelegramInstall.ps1" -Force
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\Probe-TelegramInstall.ps1" -PollSeconds 60
          if ($LASTEXITCODE -ne 0) { Write-Error "Telegram app install failed - see PROBE| lines."; exit 1 }
          # Tight curl budget for the 1 KB synthetic object (product defaults stay).
          $env:TG_CURL_MAX_SEC = '90'
          powershell -NoProfile -ExecutionPolicy Bypass -File 'C:\Work\envsys\Test-TelegramE2E.ps1'
          $code = $LASTEXITCODE
          Remove-Item Env:\TG_API_KEY -ErrorAction SilentlyContinue
          Remove-Item Env:\TG_SESSION_B64 -ErrorAction SilentlyContinue
          for ($k = 1; $k -le 9; $k++) { Remove-Item "Env:\TG_SESSION_B64_$k" -ErrorAction SilentlyContinue }
          if ($code -ne 0) { Write-Error "Telegram E2E FAILED - see TEST| lines above."; exit 1 }
          Write-Host "TELEGRAM-E2E|STATUS=READY"

      - name: Snapshot E2E, Runner A side (publish synthetic snapshot via Telegram)
        if: ${{ inputs.mode == 'snapshot-e2e' }}
        timeout-minutes: 30
        run: |
          # Acceptance part 1 of 2. Publishes ONE synthetic snapshot to the real
          # store and verifies it independently. Requires TG_API_KEY + bundle.
          $env:TG_API_KEY = "${{ secrets.TG_API_KEY }}"
          if ([string]::IsNullOrWhiteSpace($env:TG_API_KEY)) { $env:TG_API_KEY = "${{ secrets.TG_API }}" }
          $env:TG_SESSION_B64 = "${{ secrets.TG_SESSION_B64 }}"
          $env:TG_SESSION_B64_1 = "${{ secrets.TG_SESSION_B64_1 }}"
          $env:TG_SESSION_B64_2 = "${{ secrets.TG_SESSION_B64_2 }}"
          $env:TG_SESSION_B64_3 = "${{ secrets.TG_SESSION_B64_3 }}"
          $env:TG_SESSION_B64_4 = "${{ secrets.TG_SESSION_B64_4 }}"
          $env:TG_SESSION_B64_5 = "${{ secrets.TG_SESSION_B64_5 }}"
          $env:TG_SESSION_B64_6 = "${{ secrets.TG_SESSION_B64_6 }}"
          $env:TG_SESSION_B64_7 = "${{ secrets.TG_SESSION_B64_7 }}"
          $env:TG_SESSION_B64_8 = "${{ secrets.TG_SESSION_B64_8 }}"
          $env:TG_SESSION_B64_9 = "${{ secrets.TG_SESSION_B64_9 }}"
          Copy-Item -LiteralPath "${{ github.workspace }}\envsys\Probe-TelegramInstall.ps1" -Destination "$env:RUNNER_TEMP\Probe-TelegramInstall.ps1" -Force
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\Probe-TelegramInstall.ps1" -PollSeconds 60
          if ($LASTEXITCODE -ne 0) { Write-Error "Telegram app install failed - see PROBE| lines."; exit 1 }
          $env:TG_CURL_MAX_SEC = '90'
          powershell -NoProfile -ExecutionPolicy Bypass -File 'C:\Work\envsys\Test-SnapshotE2E.ps1'
          $code = $LASTEXITCODE
          Remove-Item Env:\TG_API_KEY -ErrorAction SilentlyContinue
          Remove-Item Env:\TG_SESSION_B64 -ErrorAction SilentlyContinue
          for ($k = 1; $k -le 9; $k++) { Remove-Item "Env:\TG_SESSION_B64_$k" -ErrorAction SilentlyContinue }
          if ($code -ne 0) { Write-Error "Snapshot E2E FAILED - see TEST| lines above."; exit 1 }
          Write-Host "SNAPSHOT-E2E|STATUS=READY"

      - name: Restore E2E, Runner B side (fresh runner restores + cleans store)
        if: ${{ inputs.mode == 'restore-e2e' }}
        timeout-minutes: 30
        run: |
          # Acceptance part 2 of 2. Run on a FRESH runner after snapshot-e2e.
          # Restores Runner A's snapshot, verifies content, removes test objects.
          $env:TG_API_KEY = "${{ secrets.TG_API_KEY }}"
          if ([string]::IsNullOrWhiteSpace($env:TG_API_KEY)) { $env:TG_API_KEY = "${{ secrets.TG_API }}" }
          $env:TG_SESSION_B64 = "${{ secrets.TG_SESSION_B64 }}"
          $env:TG_SESSION_B64_1 = "${{ secrets.TG_SESSION_B64_1 }}"
          $env:TG_SESSION_B64_2 = "${{ secrets.TG_SESSION_B64_2 }}"
          $env:TG_SESSION_B64_3 = "${{ secrets.TG_SESSION_B64_3 }}"
          $env:TG_SESSION_B64_4 = "${{ secrets.TG_SESSION_B64_4 }}"
          $env:TG_SESSION_B64_5 = "${{ secrets.TG_SESSION_B64_5 }}"
          $env:TG_SESSION_B64_6 = "${{ secrets.TG_SESSION_B64_6 }}"
          $env:TG_SESSION_B64_7 = "${{ secrets.TG_SESSION_B64_7 }}"
          $env:TG_SESSION_B64_8 = "${{ secrets.TG_SESSION_B64_8 }}"
          $env:TG_SESSION_B64_9 = "${{ secrets.TG_SESSION_B64_9 }}"
          Copy-Item -LiteralPath "${{ github.workspace }}\envsys\Probe-TelegramInstall.ps1" -Destination "$env:RUNNER_TEMP\Probe-TelegramInstall.ps1" -Force
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\Probe-TelegramInstall.ps1" -PollSeconds 60
          if ($LASTEXITCODE -ne 0) { Write-Error "Telegram app install failed - see PROBE| lines."; exit 1 }
          $env:TG_CURL_MAX_SEC = '90'
          powershell -NoProfile -ExecutionPolicy Bypass -File 'C:\Work\envsys\Test-RestoreE2E.ps1'
          $code = $LASTEXITCODE
          Remove-Item Env:\TG_API_KEY -ErrorAction SilentlyContinue
          Remove-Item Env:\TG_SESSION_B64 -ErrorAction SilentlyContinue
          for ($k = 1; $k -le 9; $k++) { Remove-Item "Env:\TG_SESSION_B64_$k" -ErrorAction SilentlyContinue }
          if ($code -ne 0) { Write-Error "Restore E2E FAILED - see TEST| lines above."; exit 1 }
          Write-Host "RESTORE-E2E|STATUS=READY"

      - name: Setup personal stack (auto)
        if: ${{ inputs.mode == 'rdp' }}
        run: |
          # Runs YOUR stack installer if C:\Work has it (restored), else the repo
          # copy (fresh runner). Edit envsys\Install-MyStack.ps1 once, applied every rebirth.
          if (Test-Path 'C:\Work\Install-MyStack.ps1') {
              powershell -NoProfile -ExecutionPolicy Bypass -File 'C:\Work\Install-MyStack.ps1'
          } elseif (Test-Path '${{ github.workspace }}\envsys\Install-MyStack.ps1') {
              powershell -NoProfile -ExecutionPolicy Bypass -File '${{ github.workspace }}\envsys\Install-MyStack.ps1' -WorkDir 'C:\Work'
          } else {
              Write-Host "No Install-MyStack.ps1 anywhere - skipping."
          }

      - name: Restore AI credentials (login-free boot)
        if: ${{ inputs.mode == 'rdp' }}
        env:
          OPENCODE_CONFIG_B64: ${{ secrets.OPENCODE_CONFIG_B64 }}
          OPENCODE_AUTH_B64: ${{ secrets.OPENCODE_AUTH_B64 }}
          QODER_AUTH_B64: ${{ secrets.QODER_AUTH_B64 }}
          GH_TOKEN_RESTORE: ${{ secrets.GH_TOKEN }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File '${{ github.workspace }}\envsys\Restore-AICredentials.ps1'
          # Never fail the run if a blob is absent - baseline degrades gracefully.
          exit 0

      - name: Setup Video Skills (awesome-claude-video-skills)
        if: ${{ inputs.mode == 'rdp' }}
        run: |
          # Setup awesome-claude-video-skills for RDP session
          $skillsDir = "$env:USERPROFILE\.qoder\skills\awesome-claude-video-skills"
          if (-not (Test-Path $skillsDir)) {
              git clone https://github.com/zhuyansen/awesome-claude-video-skills.git $skillsDir
          }
          # Also set up opencode skills directory
          $opencodeSkillsDir = "$env:USERPROFILE\.opencode\skills\awesome-claude-video-skills"
          if (-not (Test-Path $opencodeSkillsDir)) {
              git clone https://github.com/zhuyansen/awesome-claude-video-skills.git $opencodeSkillsDir
          }
          Write-Host "Video Skills|STATUS=READY|DIR_QODER=$skillsDir|DIR_OPencode=$opencodeSkillsDir"

      - name: Install Antigravity CLI (agy.exe, native windows_amd64)
        if: ${{ inputs.mode == 'rdp' }}
        run: |
          # install.sh is Unix-only (aborts on MINGW64 Git Bash), so install the
          # native windows_amd64 build via the CLI updater manifest instead.
          try {
              $m = Invoke-RestMethod -Uri 'https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/windows_amd64.json'
              $dir = 'C:\Antigravity'
              New-Item -ItemType Directory -Force -Path $dir | Out-Null
              $exe = Join-Path $dir 'agy.exe'
              Invoke-WebRequest -Uri $m.url -OutFile $exe -UseBasicParsing
              $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA512).Hash.ToLower()
              if ($hash -ne $m.sha512) { throw "SHA512 mismatch: $hash" }
              # Machine PATH so every RDP session finds agy (registry keeps ExpandString type)
              $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
              if (($machinePath -split ';') -notcontains $dir) {
                  $reg = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey('SYSTEM\CurrentControlSet\Control\Session Manager\Environment', $true)
                  $reg.SetValue('Path', "$machinePath;$dir", [Microsoft.Win32.RegistryValueKind]::ExpandString)
                  $reg.Close()
              }
              # Smoke test with a watchdog so a chatty binary can never stall the step
              $verJob = Start-Job -ScriptBlock { param($e) & $e --version 2>&1 } -ArgumentList $exe
              if (Wait-Job $verJob -Timeout 30) { $verOut = (Receive-Job $verJob | Select-Object -First 3) -join ' ' }
              else { Stop-Job $verJob; $verOut = '(version check timed out)' }
              Remove-Job $verJob -Force -ErrorAction SilentlyContinue
              Write-Host "CLI|STATUS=INSTALLED|VERSION=$($m.version)|EXE=$exe|SMOKE=$verOut"
          } catch {
              Write-Host "CLI|STATUS=FAILED|ERR=$($_.Exception.Message)"
          }
          exit 0

      - name: Environment bootstrap (Telegram snapshots)
        if: ${{ inputs.mode == 'rdp' }}
        run: |
          # Full reconstruction from Telegram Drive. Best-effort: needs TG_API_KEY secret
          # AND the Telegram Drive app running signed-in on this runner; skips cleanly otherwise.
          if ([string]::IsNullOrWhiteSpace("${{ secrets.TG_API_KEY }}")) {
              Write-Host "TG_API_KEY not set - skipping environment bootstrap."
              exit 0
          }
          if (-not (Test-Path 'C:\Work\envsys\Invoke-EnvBootstrap.ps1')) {
              Write-Host "envsys not in C:\Work yet - skipping (seed it once, sync preserves it)."
              exit 0
          }
          $env:TG_API_KEY = "${{ secrets.TG_API_KEY }}"
          powershell -NoProfile -ExecutionPolicy Bypass -File 'C:\Work\envsys\Invoke-EnvBootstrap.ps1' -BackendType TelegramRest -WorkDir 'C:\Work'
          if ($LASTEXITCODE -ne 0) { Write-Host "WARNING: environment bootstrap degraded - continuing with basic RDP." }

      - name: Verify RDP Accessibility
        if: ${{ inputs.mode == 'rdp' }}
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          # Test connectivity using Test-NetConnection against the Tailscale IP on port 3389
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Write RDP connection card (machine-readable IP)
        if: ${{ inputs.mode == 'rdp' }}
        env:
          RDP_PASS_FROM_SECRET: ${{ secrets.RDP_PASSWORD }}
        run: |
          # Password lives in the card so the local launcher can auto-login
          # (cmdkey TERMSRV). Ephemeral 6h machine, nothing sensitive persists.
          $pw = if (-not [string]::IsNullOrWhiteSpace($env:RDP_PASS_FROM_SECRET)) { $env:RDP_PASS_FROM_SECRET } else { 'Runner@12345' }
          $card = "$env:RUNNER_TEMP\rdp-connection.txt"
          @(
            "address=$env:TAILSCALE_IP",
            "port=3389",
            "username=RDP",
            "password=$pw",
            "run_id=$env:GITHUB_RUN_ID",
            "mode=rdp"
          ) | Out-File -LiteralPath $card -Encoding ascii
          Get-Content -LiteralPath $card
          Write-Host "Card written: $card"

      - name: Configure RDP commands (install rdp / rdp new / rdp delete)
        if: ${{ inputs.mode == 'rdp' }}
        env:
          GH_TOKEN_CARD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Installs the rdp command suite into the RDP user's PowerShell profile.
          # Profile defines: rdp [open|new|delete [-Old <n>]] (see envsys\RdpProfile.ps1)
          # It reads: C:\Work\rdp-connection.txt (card), C:\Work\.gh-token, C:\Work\.gh-repo
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'C:\Work' | Out-Null
          Copy-Item -LiteralPath "$env:RUNNER_TEMP\rdp-connection.txt" -Destination 'C:\Work\rdp-connection.txt' -Force
          Set-Content -LiteralPath 'C:\Work\.gh-repo' -Value $env:GITHUB_REPOSITORY -NoNewline -Encoding ascii
          Set-Content -LiteralPath 'C:\Work\.gh-token' -Value $env:GH_TOKEN_CARD -NoNewline -Encoding ascii
          icacls 'C:\Work\.gh-token' /inheritance:r /grant 'SYSTEM:F' /grant 'BUILTIN\Administrators:F' | Out-Null
          $profileDir = 'C:\Users\RDP\Documents\WindowsPowerShell'
          New-Item -ItemType Directory -Force -Path $profileDir | Out-Null
          Copy-Item -LiteralPath "${{ github.workspace }}\envsys\RdpProfile.ps1" -Destination "$profileDir\Microsoft.PowerShell_profile.ps1" -Force
          Write-Host "RDP|COMMANDS_CONFIGURED|profile=$profileDir\Microsoft.PowerShell_profile.ps1"

      - name: Upload RDP connection card
        if: ${{ inputs.mode == 'rdp' }}
        uses: actions/upload-artifact@v4
        with:
          name: rdp-connection-${{ github.run_id }}
          path: ${{ runner.temp }}/rdp-connection.txt
          if-no-files-found: error
          retention-days: 1

      - name: Maintain Connection (stay-alive watchdog)
        if: ${{ inputs.mode == 'rdp' }}
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "(password comes from the RDP_PASSWORD secret)"
          Write-Host "==================`n"

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          # Auto-rebirth: ~10 min before the 6h GitHub-hosted cap, dispatch a
          # successor run so service stays continuous (new run, new Tailscale IP).
          $startedAt = Get-Date
          $rebirthSent = $false
          # Keep runner alive; self-heal TermService/Tailscale so RDP stays up to the 6h job cap
          $n = 0
          while ($true) {
              # --- Auto-rebirth chain (bypasses the 6h cap by succession) ---
              $elapsedMin = [int]((Get-Date) - $startedAt).TotalMinutes
              if (-not $rebirthSent -and $elapsedMin -ge 335) {
                  $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
                  # Chain kill-switch: only continue when repo variable RDP_CHAIN = 'on'
                  $chain = 'off'
                  try { $chain = (Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/variables/RDP_CHAIN" -Headers $headers).value } catch { $chain = 'off' }
                  if ($chain -eq 'on') {
                      $body = @{ ref = 'main'; inputs = @{ mode = 'rdp' } } | ConvertTo-Json
                      try {
                          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/main.yml/dispatches" -Headers $headers -Body $body | Out-Null
                          Write-Host "[$(Get-Date)] REBIRTH|SUCCESSOR-DISPATCHED|elapsed=$elapsedMin min"
                          $rebirthSent = $true
                      } catch { Write-Host "[$(Get-Date)] REBIRTH|FAILED|err=$($_.Exception.Message)" }
                  } else {
                      Write-Host "[$(Get-Date)] REBIRTH|SKIPPED (RDP_CHAIN variable not 'on' - single session)"
                      $rebirthSent = $true
                  }
              }
              if ((Get-Service TermService).Status -ne 'Running') {
                  Start-Service TermService
                  Write-Host "[$(Get-Date)] TermService was stopped - restarted"
              }
              if ((Get-Service Tailscale -ErrorAction SilentlyContinue).Status -ne 'Running') {
                  Start-Service Tailscale -ErrorAction SilentlyContinue
                  Write-Host "[$(Get-Date)] Tailscale was stopped - restarted"
              }
              $ok = (Test-NetConnection -ComputerName '127.0.0.1' -Port 3389 -WarningAction SilentlyContinue).TcpTestSucceeded
              Write-Host "[$(Get-Date)] RDP Active (3389=$ok) - Use Cancel workflow to terminate"
              # No durable store is configured yet, so there is no auto-save target:
              # workspace changes live and die with this runner (PERSISTENCE NOT READY).
              # Local heartbeat only (~5 min cadence) as log evidence the loop is alive.
              $n++
              $hb = @{
                  runner_id = "gh-runner-$env:GITHUB_RUN_ID"
                  timestamp = (Get-Date).ToString('o')
                  beat = $n
                  state = 'healthy'
                  persistence = 'NOT-READY-no-durable-store'
                  disk_free_gb = [math]::Round((Get-PSDrive C).Free / 1GB, 1)
                  memory_free_gb = [math]::Round((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB / 1024, 1)
                  work_revision = if (Test-Path 'C:\Work') { (Get-ChildItem 'C:\Work' -Recurse -File -Force | Measure-Object).Count } else { 0 }
              } | ConvertTo-Json -Compress
              # Rotating single file (was heartbeat-$n.json unbounded for 6h); keeps disk clean.
              $hb | Out-File -LiteralPath "$env:TEMP\heartbeat-current.json" -Encoding ascii -NoNewline
              Write-Host "[$(Get-Date)] HEARTBEAT n=$n (local only; PERSISTENCE NOT READY)"
              # Full environment snapshot to Telegram (~15 min, only when TG key + envsys present)
              if (($n % 3 -eq 0) -and (-not [string]::IsNullOrWhiteSpace("${{ secrets.TG_API_KEY }}")) -and (Test-Path 'C:\Work\envsys\Publish-EnvSnapshot.ps1')) {
                  $env:TG_API_KEY = "${{ secrets.TG_API_KEY }}"
                  powershell -NoProfile -ExecutionPolicy Bypass -File 'C:\Work\envsys\Publish-EnvSnapshot.ps1' -BackendType TelegramRest -WorkDir 'C:\Work'
                  if ($LASTEXITCODE -ne 0) { Write-Host 'WARNING: Telegram snapshot failed - previous snapshot untouched.' }
                  Remove-Item Env:\TG_API_KEY -ErrorAction SilentlyContinue
              }
              Start-Sleep -Seconds 300
          }
