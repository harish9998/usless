name: win 11 + tailscale + Download.bat script

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop and disable Network Level Authentication (if needed)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 1 -Force

          # Remove any existing rule with the same name to avoid duplication
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          # Allow RDP on port 3389 (all profiles: Tailscale NIC classifies as Public)
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          # Ensure the service survives: Automatic + running (restart picks up registry flip)
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService -ErrorAction SilentlyContinue
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          $password = "${{ secrets.RDP_PASSWORD }}"
          if ([string]::IsNullOrWhiteSpace($password)) {
              Write-Error "RDP_PASSWORD secret is empty. Set it in repo Settings > Secrets and variables > Actions."
              exit 1
          }
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          } else {
              Set-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires | Out-Null
              Enable-LocalUser -Name "RDP"
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force
          Start-Service Tailscale -ErrorAction SilentlyContinue

      - name: Establish Tailscale Connection
        run: |
          # Bring up Tailscale with the provided auth key and set a unique hostname
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID --accept-dns=false --accept-routes --unattended

          # Wait for Tailscale to assign an IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Restore workspace from VPS (auto-memory)
        run: |
          # Pulls C:\Work back from the persistent VPS so a fresh runner feels like the last one.
          # Never fails the run: memory is best-effort until the VPS side is armed.
          if ([string]::IsNullOrWhiteSpace("${{ secrets.VPS_SSH_KEY }}") -or [string]::IsNullOrWhiteSpace("${{ secrets.VPS_USER }}")) {
              Write-Host "VPS sync secrets not set - skipping restore (one-time VPS setup pending)."
              exit 0
          }
          # Pulls C:\Work back from the persistent VPS so a fresh runner feels like the last one.
          $key = "$env:USERPROFILE\.ssh\vps_key"
          New-Item -ItemType Directory -Path (Split-Path $key) -Force | Out-Null
          "${{ secrets.VPS_SSH_KEY }}" | Out-File -LiteralPath $key -Encoding ascii -NoNewline
          icacls $key /inheritance:r /grant:r "$env:USERNAME:F" | Out-Null
          New-Item -ItemType Directory -Path 'C:\Work' -Force | Out-Null
          $ssh = @('-i', $key, '-o', 'StrictHostKeyChecking=no', '-o', 'BatchMode=yes', '-o', 'ConnectTimeout=15')
          # Probe first: a half-configured VPS must degrade to skip, never to a red run.
          & ssh @ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "echo ok" 2>$null
          if ($LASTEXITCODE -ne 0) {
              Write-Host "WARNING: VPS SSH unreachable - continuing without memory (run stays green)."
              exit 0
          }
          Write-Host "Restoring C:\Work from VPS..."
          & scp @ssh -r "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:C:/VPS-Work/*" 'C:\Work\' 2>$null
          Write-Host "Restore done (empty on first run is normal)."
          # Profile layer (opencode/claude/git/profiles): best-effort, never red.
          $pet = 'C:\Work\PersistentEnvironmentToolkit\Sync-PersistentEnvironment.ps1'
          if (Test-Path $pet) {
              powershell -NoProfile -ExecutionPolicy Bypass -File $pet -Mode Restore
              if ($LASTEXITCODE -ne 0) { Write-Host 'WARNING: profile restore degraded - continuing.' }
          } else { Write-Host 'No profile toolkit - skipping.' }
          echo "VPS_SYNC=1" >> $env:GITHUB_ENV

      - name: Setup personal stack (auto)
        run: |
          # Runs YOUR C:\Work\Install-MyStack.ps1 if you created it (edit once, applied every rebirth).
          if (Test-Path 'C:\Work\Install-MyStack.ps1') {
              powershell -NoProfile -ExecutionPolicy Bypass -File 'C:\Work\Install-MyStack.ps1'
          } else {
              Write-Host "No C:\Work\Install-MyStack.ps1 - skipping (create it to auto-install your tools)."
          }

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          # Test connectivity using Test-NetConnection against the Tailscale IP on port 3389
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection (stay-alive watchdog)
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "(password comes from the RDP_PASSWORD secret)"
          Write-Host "==================`n"

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          # Keep runner alive; self-heal TermService/Tailscale so RDP stays up to the 6h job cap
          $n = 0
          while ($true) {
              if ((Get-Service TermService).Status -ne 'Running') {
                  Start-Service TermService
                  Write-Host "[$(Get-Date)] TermService was stopped - restarted"
              }
              if ((Get-Service Tailscale -ErrorAction SilentlyContinue).Status -ne 'Running') {
                  Start-Service Tailscale -ErrorAction SilentlyContinue
                  Write-Host "[$(Get-Date)] Tailscale was stopped - restarted"
              }
              $ok = (Test-NetConnection -ComputerName '127.0.0.1' -Port 3389 -WarningAction SilentlyContinue).TcpTestSucceeded
              Write-Host "[$(Get-Date)] RDP Active (3389=$ok) - Use Cancel workflow to terminate"
              # Auto-save workspace to VPS every ~15 min so nothing is lost at the 6h wipe
              $n++
              if ($env:VPS_SYNC -eq '1' -and ($n % 3 -eq 0)) {
                  $key = "$env:USERPROFILE\.ssh\vps_key"
                  $ssh = @('-i', $key, '-o', 'StrictHostKeyChecking=no', '-o', 'BatchMode=yes', '-o', 'ConnectTimeout=15')
                  # Capture profile/app state into C:\Work first so the snapshot includes it.
                  $pet = 'C:\Work\PersistentEnvironmentToolkit\Sync-PersistentEnvironment.ps1'
                  if (Test-Path $pet) {
                      powershell -NoProfile -ExecutionPolicy Bypass -File $pet -Mode Capture
                      if ($LASTEXITCODE -ne 0) { Write-Host 'WARNING: profile capture degraded - snapshotting anyway.' }
                  }
                  & scp @ssh -r 'C:\Work\*' "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:C:/VPS-Work/" 2>$null
                  Write-Host "[$(Get-Date)] Workspace auto-saved to VPS"
              }
              # Heartbeat (~5 min cadence; 60s would spam logs/minutes for zero gain here)
              if ($env:VPS_SYNC -eq '1') {
                  $hb = @{
                      runner_id = "gh-runner-$env:GITHUB_RUN_ID"
                      timestamp = (Get-Date).ToString('o')
                      state = 'healthy'
                      disk_free_gb = [math]::Round((Get-PSDrive C).Free / 1GB, 1)
                      memory_free_gb = [math]::Round((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB / 1024, 1)
                      work_revision = if (Test-Path 'C:\Work') { (Get-ChildItem 'C:\Work' -Recurse -File | Measure-Object).Count } else { 0 }
                  } | ConvertTo-Json -Compress
                  $hb | Out-File -LiteralPath "$env:TEMP\heartbeat.json" -Encoding ascii -NoNewline
                  $key = "$env:USERPROFILE\.ssh\vps_key"
                  & scp @('-i', $key, '-o', 'StrictHostKeyChecking=no', '-o', 'BatchMode=yes', '-o', 'ConnectTimeout=15') "$env:TEMP\heartbeat.json" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:C:/VPS-Work/heartbeats/gh-runner-$env:GITHUB_RUN_ID.json" 2>$null
              }
              Start-Sleep -Seconds 300
          }
